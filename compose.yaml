services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triage}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql:ro
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-init:
    image: ollama/ollama
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull "$${LLM_MODEL}"
        ollama pull "$${OLLAMA_EMBEDDING_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy

  migrate:
    image: pgvector/pgvector:pg17
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-triage}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: ["/bin/sh", "/postgres/run-migrations.sh"]
    volumes:
      - ./infrastructure/postgres:/postgres:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/triage}
      TAXONOMY_PUBLICATION_ENABLED: ${TAXONOMY_PUBLICATION_ENABLED:-false}
      TAXONOMY_MUTATION_TOKEN: ${TAXONOMY_MUTATION_TOKEN:-}
      TAXONOMY_REVIEW_TOKEN: ${TAXONOMY_REVIEW_TOKEN:-}
      OPERATIONS_RATE_LIMIT_REQUESTS: ${OPERATIONS_RATE_LIMIT_REQUESTS:-30}
      OPERATIONS_RATE_LIMIT_WINDOW_SECONDS: ${OPERATIONS_RATE_LIMIT_WINDOW_SECONDS:-60}
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:-http://localhost:8080}
      PUBLIC_SITE_NAME: ${PUBLIC_SITE_NAME:-Evidence-led insights}
      PUBLIC_SITE_DESCRIPTION: ${PUBLIC_SITE_DESCRIPTION:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy

  admin-web:
    profiles: ["admin"]
    build:
      context: ./frontend/admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy

  public-web:
    build:
      context: ./frontend/public
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  google-sheets:
    profiles: ["google-sheets"]
    build:
      context: ./backend
    command:
      - python
      - -m
      - triage_processor.integrations.google_sheets
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/triage}
      API_BASE_URL: http://api:8000
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-sheets.json
      GOOGLE_SHEETS_POLL_INTERVAL: ${GOOGLE_SHEETS_POLL_INTERVAL:-5}
      GOOGLE_SHEETS_BATCH_SIZE: ${GOOGLE_SHEETS_BATCH_SIZE:-100}
      GOOGLE_SHEETS_TIMEOUT_SECONDS: ${GOOGLE_SHEETS_TIMEOUT_SECONDS:-30}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${GOOGLE_SHEETS_CREDENTIALS_FILE:-./.secrets/google-sheets.json}:/run/secrets/google-sheets.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started

  eligibility-segmentation:
    build:
      context: ./backend
    command: ["python", "-m", "triage_processor.workers.eligibility_segmentation"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/triage}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      SEGMENTATION_VALIDATION_ATTEMPTS: ${SEGMENTATION_VALIDATION_ATTEMPTS:-3}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2}
      QUEUE_LEASE_SECONDS: ${QUEUE_LEASE_SECONDS:-300}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-5}
      QUEUE_RETRY_BASE_SECONDS: ${QUEUE_RETRY_BASE_SECONDS:-5}
      QUEUE_RETRY_MAX_SECONDS: ${QUEUE_RETRY_MAX_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  embeddings:
    build:
      context: ./backend
    command: ["python", "-m", "triage_processor.workers.embeddings"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/triage}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EMBEDDING_DIMENSIONS:
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      OLLAMA_EMBEDDING_BATCH_SIZE: ${OLLAMA_EMBEDDING_BATCH_SIZE:-16}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2}
      QUEUE_LEASE_SECONDS: ${QUEUE_LEASE_SECONDS:-300}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-5}
      QUEUE_RETRY_BASE_SECONDS: ${QUEUE_RETRY_BASE_SECONDS:-5}
      QUEUE_RETRY_MAX_SECONDS: ${QUEUE_RETRY_MAX_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  taxonomy-scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "triage_processor.taxonomy_scheduler"]
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-m", "triage_processor.taxonomy_scheduler", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/triage}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TAXONOMY_POLL_INTERVAL: ${TAXONOMY_POLL_INTERVAL:-10}
      TAXONOMY_LEASE_SECONDS: ${TAXONOMY_LEASE_SECONDS:-900}
      TAXONOMY_MAX_ATTEMPTS: ${TAXONOMY_MAX_ATTEMPTS:-3}
      TAXONOMY_RETRY_BASE_SECONDS: ${TAXONOMY_RETRY_BASE_SECONDS:-5}
      TAXONOMY_RETRY_MAX_SECONDS: ${TAXONOMY_RETRY_MAX_SECONDS:-300}
      TAXONOMY_SCHEDULER_CONFIGURATION_VERSION: ${TAXONOMY_SCHEDULER_CONFIGURATION_VERSION:-taxonomy-scheduler-v1}
      TAXONOMY_AUTOMATION_ENABLED: ${TAXONOMY_AUTOMATION_ENABLED:-true}
      TAXONOMY_AUTOMATION_POLICY_VERSION: ${TAXONOMY_AUTOMATION_POLICY_VERSION:-taxonomy-automation-v1}
      TAXONOMY_AUTOMATION_MINIMUM_EVIDENCE: ${TAXONOMY_AUTOMATION_MINIMUM_EVIDENCE:-1}
      TAXONOMY_AUTOMATION_QUIET_SECONDS: ${TAXONOMY_AUTOMATION_QUIET_SECONDS:-30}
      TAXONOMY_EMBEDDING_REPRESENTATION: ${TAXONOMY_EMBEDDING_REPRESENTATION:-question-answer}
      TAXONOMY_EMBEDDING_DIMENSION: ${TAXONOMY_EMBEDDING_DIMENSION:-768}
      TAXONOMY_CLUSTERING_MODEL: ${TAXONOMY_CLUSTERING_MODEL:-hdbscan-0.8.44}
      TAXONOMY_TOPIC_PROMPT_VERSION: ${TAXONOMY_TOPIC_PROMPT_VERSION:-taxonomy-topic-v1}
      TAXONOMY_THEME_PROMPT_VERSION: ${TAXONOMY_THEME_PROMPT_VERSION:-taxonomy-theme-v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  article-generation:
    build:
      context: ./backend
    command: ["python", "-m", "triage_processor.workers.article_generation"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/triage}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      GENERATION_WORKER_POLL_INTERVAL: ${GENERATION_WORKER_POLL_INTERVAL:-2}
      GENERATION_QUEUE_LEASE_SECONDS: ${GENERATION_QUEUE_LEASE_SECONDS:-600}
      GENERATION_QUEUE_MAX_ATTEMPTS: ${GENERATION_QUEUE_MAX_ATTEMPTS:-3}
      GENERATION_QUEUE_RETRY_BASE_SECONDS: ${GENERATION_QUEUE_RETRY_BASE_SECONDS:-10}
      GENERATION_QUEUE_RETRY_MAX_SECONDS: ${GENERATION_QUEUE_RETRY_MAX_SECONDS:-600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  ollama_models:
