[project]
name = "triage-organisation-processor"
version = "0.1.0"
description = "API for ingesting and organizing text inputs."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_processor"]
