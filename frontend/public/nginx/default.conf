server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @public_server_error;

    include /etc/nginx/security-headers.inc;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.inc;
        return 200 "ok\n";
    }

    location = /favicon.svg {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.inc;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.inc;
    }

    location ~ "^/assets/[A-Za-z0-9_-]+\\.[a-f0-9]{8,}\\.(?:css|js|svg|woff2)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.inc;
    }

    # Only declared editorial routes reach the internal HTML renderer.  The
    # renderer itself is never addressable from the public edge.
    location = / {
        proxy_pass http://api:8000/_site/;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.inc;
    }
    location = /insights {
        proxy_pass http://api:8000/_site/insights;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.inc;
    }
    location ~ ^/insights/([^/]+)$ {
        rewrite ^/insights/(.*)$ /_site/insights/$1 break;
        proxy_pass http://api:8000;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.inc;
    }
    location = /themes {
        proxy_pass http://api:8000/_site/themes;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.inc;
    }
    location ~ ^/themes/([0-9]+-[^/]+)$ {
        rewrite ^/themes/(.*)$ /_site/themes/$1 break;
        proxy_pass http://api:8000;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.inc;
    }
    location = /about {
        proxy_pass http://api:8000/_site/about;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.inc;
    }
    location = /robots.txt {
        proxy_pass http://api:8000/_site/robots.txt;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.inc;
    }
    location = /sitemap.xml {
        proxy_pass http://api:8000/_site/sitemap.xml;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.inc;
    }

    location / {
        error_page 404 = @public_not_found;
        return 404;
    }

    location @public_not_found {
        internal;
        rewrite ^ /_site/__not_found break;
        proxy_pass http://api:8000;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.inc;
    }

    location @public_server_error {
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.inc;
        return 500 "<!doctype html><title>Service unavailable</title><h1>Service unavailable</h1>";
    }
}
